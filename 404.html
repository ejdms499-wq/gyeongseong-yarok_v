<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>경성야록 · 길을 잃었소</title>
<script>window.__ykTeamOnly = 1;</script>
<script src="/gyeongseong-yarok_v/shared/yk-teamlinks.js"></script>
<script>
/* 옛 자리 이름으로 들어온 주소를 정리판 제자리로 넘김 (예: /hogoe.html → /exhibits/hogoe/hogoe.html) */
(function () {
  try {
    var B = '/gyeongseong-yarok_v/', p = location.pathname;
    if (p.indexOf(B) !== 0) return;
    var rel = decodeURIComponent(p.slice(B.length));
    var t = window.ykTeamPath && window.ykTeamPath(rel);
    if (!t) {
      /* 한 단계 더: 폴더가 겹쳐 붙은 주소(exhibits/fair/appendix.html 등)는 끝 이름으로 */
      var tail = rel.split('/').slice(-2).join('/');
      t = window.ykTeamPath && (window.ykTeamPath(tail) || window.ykTeamPath(rel.split('/').pop()));
    }
    if (t && t !== rel) location.replace(B + t + location.search + location.hash);
  } catch (e) {}
})();
</script>
