<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Noto Serif KR','Nanum Myeongjo','Batang',serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#efe4cc"/>
      <circle cx="1" cy="2" r=".6" fill="#d9c9a6" opacity=".6"/>
      <circle cx="4" cy="5" r=".5" fill="#d2c09a" opacity=".5"/>
    </pattern>
  </defs>

  <!-- 종이 -->
  <rect x="0" y="0" width="1200" height="760" fill="url(#grain)"/>
  <rect x="18" y="18" width="1164" height="724" fill="none" stroke="#2b2118" stroke-width="3"/>
  <rect x="26" y="26" width="1148" height="708" fill="none" stroke="#2b2118" stroke-width="1"/>

  <!-- 제호 -->
  <text x="600" y="92" text-anchor="middle" font-size="54" font-weight="900" fill="#1e1913" letter-spacing="10">京城野錄</text>
  <text x="600" y="126" text-anchor="middle" font-size="18" fill="#5a4e3e" letter-spacing="6">경성야록 · 한눈에 보기</text>
  <line x1="60" y1="146" x2="1140" y2="146" stroke="#2b2118" stroke-width="2"/>
  <line x1="60" y1="152" x2="1140" y2="152" stroke="#2b2118" stroke-width=".8"/>
  <text x="600" y="182" text-anchor="middle" font-size="17" fill="#3d3328">1930년대 동아일보 지면을 본뜬 미스터리 아카이브 — 신문 한 줄에서 시작해 사건 · 전시관 · 3D 탈출 게임으로 이어집니다</text>

  <!-- 숫자 카드 6개 -->
  <g font-size="16" fill="#3d3328">
    <g transform="translate(60,212)">
      <rect width="170" height="150" fill="#f6eedb" stroke="#2b2118"/>
      <text x="85" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#8b251b">4</text>
      <text x="85" y="106" text-anchor="middle" font-weight="700">사건 지면</text>
      <text x="85" y="130" text-anchor="middle" font-size="13" fill="#6b5d48">PC판 + 모바일판</text>
    </g>
    <g transform="translate(244,212)">
      <rect width="170" height="150" fill="#f6eedb" stroke="#2b2118"/>
      <text x="85" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#8b251b">9</text>
      <text x="85" y="106" text-anchor="middle" font-weight="700">부록 전시관</text>
      <text x="85" y="130" text-anchor="middle" font-size="13" fill="#6b5d48">박람회 · 상점 · 호외 …</text>
    </g>
    <g transform="translate(428,212)">
      <rect width="170" height="150" fill="#f6eedb" stroke="#2b2118"/>
      <text x="85" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#8b251b">4<tspan font-size="26" fill="#6b5d48">/11</tspan></text>
      <text x="85" y="106" text-anchor="middle" font-weight="700">숨은 소지품</text>
      <text x="85" y="130" text-anchor="middle" font-size="13" fill="#6b5d48">4개 모으면 문이 열림</text>
    </g>
    <g transform="translate(612,212)">
      <rect width="170" height="150" fill="#f6eedb" stroke="#2b2118"/>
      <text x="85" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#8b251b">10<tspan font-size="26" fill="#6b5d48">분</tspan></text>
      <text x="85" y="106" text-anchor="middle" font-weight="700">식자실 탈출</text>
      <text x="85" y="130" text-anchor="middle" font-size="13" fill="#6b5d48">3D · PC / 모바일</text>
    </g>
    <g transform="translate(796,212)">
      <rect width="170" height="150" fill="#f6eedb" stroke="#2b2118"/>
      <text x="85" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#8b251b">13</text>
      <text x="85" y="106" text-anchor="middle" font-weight="700">필수 수수께끼</text>
      <text x="85" y="130" text-anchor="middle" font-size="13" fill="#6b5d48">4개 공간 · 난이도 상중하</text>
    </g>
    <g transform="translate(980,212)">
      <rect width="160" height="150" fill="#1e1913" stroke="#2b2118"/>
      <text x="80" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#e9d9b8">6</text>
      <text x="80" y="106" text-anchor="middle" font-weight="700" fill="#e9d9b8">무작위 귀신</text>
      <text x="80" y="130" text-anchor="middle" font-size="13" fill="#bfae8c">매 판 시간 · 장소 바뀜</text>
    </g>
  </g>

  <!-- 플레이 흐름 -->
  <text x="60" y="414" font-size="20" font-weight="900" fill="#1e1913">◆ 이렇게 즐깁니다</text>
  <line x1="60" y1="424" x2="1140" y2="424" stroke="#2b2118" stroke-width=".8"/>
  <g font-size="14" fill="#3d3328">
    <g transform="translate(60,444)">
      <circle cx="34" cy="34" r="30" fill="#8b251b"/><text x="34" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">讀</text>
      <text x="80" y="28" font-weight="900" font-size="17">① 읽기</text>
      <text x="80" y="52">한자에 마우스를 올리면</text>
      <text x="80" y="72">먹물이 번지듯 한글로</text>
    </g>
    <g transform="translate(330,444)">
      <circle cx="34" cy="34" r="30" fill="#8b251b"/><text x="34" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">探</text>
      <text x="80" y="28" font-weight="900" font-size="17">② 둘러보기</text>
      <text x="80" y="52">사건 4편 · 전시관 9곳</text>
      <text x="80" y="72">지면 · 장치 · 소리 체험</text>
    </g>
    <g transform="translate(600,444)">
      <circle cx="34" cy="34" r="30" fill="#8b251b"/><text x="34" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">拾</text>
      <text x="80" y="28" font-weight="900" font-size="17">③ 줍기</text>
      <text x="80" y="52">기사 위에 잠시 머물면</text>
      <text x="80" y="72">식자공의 소지품이 보임</text>
    </g>
    <g transform="translate(870,444)">
      <circle cx="34" cy="34" r="30" fill="#1e1913"/><text x="34" y="44" text-anchor="middle" font-size="26" font-weight="900" fill="#e9d9b8">脫</text>
      <text x="80" y="28" font-weight="900" font-size="17">④ 탈출하기</text>
      <text x="80" y="52">거꾸로 박힌 「版」 →</text>
      <text x="80" y="72">10분 안에 식자실 탈출</text>
    </g>
  </g>
  <g stroke="#8b251b" stroke-width="2" fill="none">
    <path d="M306 478 h20 m-8 -6 l8 6 l-8 6"/>
    <path d="M576 478 h20 m-8 -6 l8 6 l-8 6"/>
    <path d="M846 478 h20 m-8 -6 l8 6 l-8 6"/>
  </g>

  <!-- 식자실 진행 막대 -->
  <text x="60" y="568" font-size="20" font-weight="900" fill="#1e1913">◆ 식자실 안에서 — 방마다 문제를 다 풀어야 다음 문이 열림</text>
  <line x1="60" y1="578" x2="1140" y2="578" stroke="#2b2118" stroke-width=".8"/>
  <g font-size="14" fill="#f6eedb" font-weight="700">
    <rect x="60"  y="596" width="470" height="56" fill="#3d3328"/>
    <text x="295" y="621" text-anchor="middle">1층 식자실 · 7문제</text>
    <text x="295" y="641" text-anchor="middle" font-weight="400" font-size="12" fill="#d9c9a6">역사 퀴즈 6 + 괘종시계 1 · 열쇠를 얻어 철문으로</text>
    <rect x="534" y="596" width="200" height="56" fill="#5a4535"/>
    <text x="634" y="621" text-anchor="middle">지하 자료실 · 2</text>
    <text x="634" y="641" text-anchor="middle" font-weight="400" font-size="12" fill="#d9c9a6">기록 복원 2건</text>
    <rect x="738" y="596" width="130" height="56" fill="#6e2a20"/>
    <text x="803" y="621" text-anchor="middle">암실 · 1</text>
    <text x="803" y="641" text-anchor="middle" font-weight="400" font-size="12" fill="#e6c8bf">기록 복원 1건</text>
    <rect x="872" y="596" width="268" height="56" fill="#8b251b"/>
    <text x="1006" y="621" text-anchor="middle">사진 건조방 · 3 → 엔딩</text>
    <text x="1006" y="641" text-anchor="middle" font-weight="400" font-size="12" fill="#f0d5cd">마지막 사진이 뒤집히면</text>
  </g>

  <!-- 바닥글 -->
  <line x1="60" y1="684" x2="1140" y2="684" stroke="#2b2118" stroke-width=".8"/>
  <text x="60" y="712" font-size="13" fill="#6b5d48">「재현 그림」 표시 = AI(미드저니)로 새로 그린 그림 · 「편집국 재구성」 표시 = 기록에 없는 부분을 지어 쓴 글 · 기사 제목 · 날짜는 확인된 기록만 사용</text>
</svg>
