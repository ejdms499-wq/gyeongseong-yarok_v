<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>경성야록 — 단신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<!--
  경성야록 · 단신(短信) 한 장 (1014)
  - 주소 뒤 ?id=사건 (예: dansin.html?id=jangjinhong) · 내용은 dansin-data.js
  - 본편 네 사건 밖, 지면에서 밀려난 긔록을 한 장짜리로: 당시 제목 · 요지 · 그때 신문은 · 그 뒤 · 출처
-->
<style>
:root{--ink:#1d1813;--paper:#ebe2cf;--paper2:#e3d8c2;--rule:#3a3128;--fade:#7b7062;--seal:#8a2a21;--my:"Nanum Myeongjo","Noto Serif KR","Batang",serif;--se:"Noto Serif KR","Nanum Myeongjo",serif;--sa:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#2a231c}
body{min-height:100vh;color:var(--ink);font-family:var(--my);-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#3a3027,#1d1813 70%)}
a{color:inherit}
.sheet{position:relative;max-width:1080px;margin:28px auto 40px;background:var(--paper);box-shadow:0 30px 80px #000a;padding:30px clamp(18px,4vw,54px) 40px;
  background-image:repeating-linear-gradient(0deg,rgba(60,45,30,.03) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 30%,#efe7d6,#e2d6bf)}
.sheet:after{content:"";position:absolute;inset:10px;border:1px solid rgba(58,49,40,.28);pointer-events:none}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:3px double var(--rule);padding-bottom:10px}
.mast .k{font:500 11px/1 var(--sa);letter-spacing:.42em;color:var(--fade)}
.mast h1{margin-top:8px;font:800 clamp(22px,2.6vw,30px)/1 var(--my);letter-spacing:.2em}
.mast h1 small{font:700 14px var(--my);letter-spacing:.3em;color:var(--seal);margin-left:10px}
.mast nav{display:flex;gap:16px;font:500 12.5px var(--sa);letter-spacing:.12em}
.mast nav a{text-decoration:none;border-bottom:1px solid transparent}
.mast nav a:hover{border-bottom-color:var(--ink)}
.idx{display:flex;flex-wrap:wrap;gap:0;margin:12px 0 0;border-bottom:1px solid var(--rule)}
.idx a{flex:1 1 auto;min-width:0;padding:8px 10px 9px;text-decoration:none;font:700 13px/1.35 var(--my);letter-spacing:.04em;border-right:1px solid rgba(58,49,40,.25);color:#5a5046;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx a:last-child{border-right:0}
.idx a b{font:800 11px var(--my);color:var(--seal);margin-right:6px}
.idx a.on{background:var(--ink);color:var(--paper)}
.idx a.on b{color:#e4c48a}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:22px 0 0;font:500 12px var(--sa);letter-spacing:.14em;color:var(--fade)}
.meta .sec{color:var(--paper);background:var(--seal);padding:3px 9px;letter-spacing:.2em}
.old{margin-top:14px;font:900 clamp(30px,5vw,58px)/1.18 var(--se);letter-spacing:.04em;cursor:help;word-break:keep-all}
.old.gloss{font-family:var(--my);font-weight:800}
.title{margin-top:12px;font:800 clamp(18px,2.1vw,24px)/1.45 var(--my);letter-spacing:.02em;word-break:keep-all}
.lead{margin-top:10px;padding:10px 0 14px;border-bottom:1px solid var(--rule);font:400 clamp(14.5px,1.4vw,16.5px)/1.8 var(--my);color:#3e352c}
.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3.4vw,44px);margin-top:24px}
.body.noimg{grid-template-columns:minmax(0,1fr)}
.body.noimg .txt{columns:2;column-gap:44px}
.body.noimg .txt section{break-inside:avoid}
.figs{display:flex;flex-direction:column;gap:20px}
figure{background:#f3ecdc;padding:10px;box-shadow:0 2px 0 rgba(58,49,40,.2),0 12px 26px rgba(40,30,20,.18)}
figure button{display:block;width:100%;border:0;background:none;padding:0;cursor:zoom-in}
figure img{display:block;width:100%;height:auto;filter:sepia(.25) contrast(1.05)}
figcaption{margin-top:8px;font:400 11.5px/1.6 var(--sa);color:var(--fade);letter-spacing:.02em}
figcaption b{color:var(--seal);font-weight:500;margin-right:6px}
.txt section{margin-bottom:22px}
.txt h3{display:flex;align-items:center;gap:10px;font:800 14px/1 var(--my);letter-spacing:.28em;margin-bottom:10px}
.txt h3:after{content:"";flex:1;height:1px;background:rgba(58,49,40,.35)}
.txt p{font:400 clamp(14.5px,1.25vw,15.6px)/1.95 var(--my);color:#2b2219;margin-bottom:8px;word-break:keep-all}
.txt .today p{font-style:normal;color:var(--seal)}
.go{display:inline-flex;gap:10px;align-items:center;margin-top:6px;font:700 14px var(--my);text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:4px}
.foot{margin-top:28px;padding-top:14px;border-top:3px double var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}
.foot h4{font:700 12px var(--sa);letter-spacing:.3em;color:var(--fade);margin-bottom:6px}
.foot ul{list-style:none;font:400 12.5px/1.75 var(--sa);color:#4b4238}
.foot ul li:before{content:"· "}
.foot .note{margin-top:8px;font:400 12px/1.7 var(--sa);color:var(--seal)}
.grade{display:grid;place-items:center;width:74px;height:74px;border:2px solid var(--seal);color:var(--seal);transform:rotate(-6deg);text-align:center;font:800 11px/1.25 var(--my);letter-spacing:.12em}
.grade b{display:block;font-size:28px;letter-spacing:0;margin:2px 0}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:26px;font:700 13.5px var(--my)}
.pn a{text-decoration:none;max-width:48%}
.pn a small{display:block;font:500 11px var(--sa);letter-spacing:.2em;color:var(--fade);margin-bottom:3px}
.pn .nx{text-align:right;margin-left:auto}
.lb{position:fixed;inset:0;z-index:50;background:#0b0907e8;display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-width:min(96vw,1100px);max-height:90vh;filter:sepia(.2)}
.lock{position:relative;margin-top:24px;min-height:300px}
.lock .fog{filter:blur(6px);opacity:.55;pointer-events:none;user-select:none}
.lock .fog p{font:400 15px/1.95 var(--my);margin-bottom:10px}
.lock .gate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);background:#efe7d6;border:1px solid var(--rule);box-shadow:0 20px 50px rgba(40,30,20,.3);padding:26px 26px 22px;text-align:center}
.lock .gate .k{font:500 11px var(--sa);letter-spacing:.4em;color:var(--seal)}
.lock .gate h4{margin:10px 0 6px;font:800 19px/1.5 var(--my);letter-spacing:.06em}
.lock .gate p{font:400 13px/1.7 var(--sa);color:#5a5046}
.lock .gate button{margin-top:16px;background:var(--ink);color:var(--paper);border:0;padding:12px 22px;font:700 14px var(--my);letter-spacing:.2em;cursor:pointer}
.miss{padding:80px 0;text-align:center;font:400 15px/1.9 var(--my)}
@media (max-width:760px){.body{grid-template-columns:1fr}.body.noimg .txt{columns:1}.mast{flex-direction:column;align-items:flex-start}.foot{grid-template-columns:1fr}.grade{width:64px;height:64px}.idx a{flex:1 1 33%}}
@media (prefers-reduced-motion:no-preference){.in{animation:fi .7s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
.quiet .in{animation:none!important}
</style>
</head>
<body>
<main class="sheet" id="sheet">
  <header class="mast">
    <div><p class="k">京 城 野 錄 · 短 信</p><h1>단신<small>지면에서 밀려난 긔록</small></h1></div>
    <nav><a href="index.html">본지로</a><a href="fair.html">부록 박람회</a></nav>
  </header>
  <nav class="idx" id="idx" aria-label="단신 차례"></nav>
  <article id="art"></article>
</main>
<div class="lb" id="lb" role="dialog" aria-label="지면 크게 보기"><img alt=""></div>
<script src="dansin-data.js?v=1"></script>
<script src="yk-config.js?v=1"></script>
<script src="yk-auth.js?v=2"></script>
<script src="yk-class.js?v=3"></script>
<script src="yk-paywall.js?v=2"></script>
<script>
(function(){
'use strict';
var D=document,L=window.YK_DANSIN||[],$=function(i){return D.getElementById(i)};
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var id=(location.search.match(/[?&]id=([\w-]+)/)||[])[1]||(L[0]&&L[0].id), i=-1;
L.forEach(function(x,k){if(x.id===id)i=k});
$('idx').innerHTML=L.map(function(x){return '<a href="dansin.html?id='+x.id+'" class="'+(x.id===id?'on':'')+'" title="'+esc(x.title)+'"><b>'+x.no+'</b>'+esc(x.short||x.title)+'</a>'}).join('');
var a=L[i];
if(!a){$('art').innerHTML='<p class="miss">그런 단신은 업소.<br><a href="index.html">본지로 도라가시압</a></p>';return}
D.title='경성야록 — 단신 · '+a.title;
if(a.quiet)D.body.classList.add('quiet');
function ps(arr){return (arr||[]).map(function(t){return '<p>'+esc(t)+'</p>'}).join('')}
var GR={A:['甲','확인'],B:['乙','대체로 확인'],C:['丙','소문']}[a.grade]||['乙',''];
var figs=(a.images||[]).map(function(m){return '<figure class="in"><button type="button" data-src="'+esc(m.src)+'" aria-label="크게 보기"><img src="'+esc(m.src)+'" alt="'+esc(m.cap)+'" loading="lazy"></button><figcaption><b>'+(m.kind==='scan'?'當時 紙面':m.kind==='doc'?'所藏 資料':'그림 · 재현')+'</b>'+esc(m.cap.replace(/^당시 지면 · /,''))+'</figcaption></figure>'}).join('');
var h='<p class="meta in"><span class="sec">'+esc(a.sec)+'면</span><span>'+esc(a.year)+'</span><span>'+esc(a.place)+'</span><span>'+(a.kind==='인물'?'인물 단신':'사건 단신')+'</span></p>'+
  (a.old?'<h2 class="old in" tabindex="0" data-ko="'+esc(a.oldKo)+'" title="마우스를 올리면 오늘 말로">'+esc(a.old)+'</h2>':'')+
  '<p class="title in">'+esc(a.title)+'</p><p class="lead in">'+esc(a.lead)+'</p>'+
  '<div class="body'+(figs?'':' noimg')+'">'+(figs?'<div class="figs">'+figs+'</div>':'')+
  '<div class="txt">'+
    '<section class="in"><h3>요지</h3>'+ps(a.facts)+'</section>'+
    (a.press&&a.press.length?'<section class="in"><h3>그때 신문은</h3>'+ps(a.press)+'</section>':'')+
    (a.after&&a.after.length?'<section class="in"><h3>그 뒤</h3>'+ps(a.after)+'</section>':'')+
    (a.today?'<section class="in today"><h3>오늘의 시선</h3><p>'+esc(a.today)+'</p></section>':'')+
    (a.link?'<a class="go" href="'+esc(a.link.href)+'">'+esc(a.link.label)+' →</a>':'')+
  '</div></div>'+
  '<footer class="foot"><div><h4>出處 · 출처</h4><ul>'+(a.sources||[]).map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>'+(a.note?'<p class="note">※ '+esc(a.note)+'</p>':'')+'</div>'+
  '<div class="grade" title="리서치 자료집 신빙성 등급 '+esc(a.grade)+'">確認<b>'+GR[0]+'</b>'+esc(GR[1])+'</div></footer>'+
  '<nav class="pn">'+(L[i-1]?'<a href="dansin.html?id='+L[i-1].id+'"><small>← 앞 단신</small>'+esc(L[i-1].title)+'</a>':'<span></span>')+(L[i+1]?'<a class="nx" href="dansin.html?id='+L[i+1].id+'"><small>다음 단신 →</small>'+esc(L[i+1].title)+'</a>':'<a class="nx" href="index.html"><small>끝</small>본지로 도라가시압</a>')+'</nav>';
var lockedHTML='<p class="meta in"><span class="sec">'+esc(a.sec)+'면</span><span>'+esc(a.year)+'</span><span>'+esc(a.place)+'</span><span>정긔 독자 전용</span></p>'+
  (a.old?'<h2 class="old in">'+esc(a.old)+'</h2>':'')+'<p class="title in">'+esc(a.title)+'</p><p class="lead in">'+esc(a.lead)+'</p>'+
  '<div class="lock"><div class="fog"><p>'+esc((a.facts||[]).join(' ')).replace(/[가-힣0-9]/g,'긔')+'</p><p>'+esc((a.press||[]).join(' ')).replace(/[가-힣0-9]/g,'긔')+'</p></div>'+
  '<div class="gate"><p class="k">購讀 案內</p><h4>이 긔록은 정긔 독자께만 배달하오</h4><p>한 장 '+(window.ykPay?ykPay.ONE:5)+'錢 · 월정 구독 '+(window.ykPay?ykPay.ALL:100)+'錢</p><button type="button" id="unlock">구독하고 읽기</button></div></div>'+
  '<nav class="pn"><a href="index.html"><small>←</small>본지로 도라가시압</a></nav>';
function paint(open){ $('art').innerHTML=open?h:lockedHTML; if(open) wire(); else { var u=$('unlock'); if(u) u.onclick=function(){ ykPay.open(a.id,a.title,function(){ paint(true); }); }; } }
if(window.ykPay){ $('art').innerHTML='<p class="miss">…</p>'; ykAuth.ready.then(function(){ return ykPay.has(a.id); }).then(function(ok){ paint(ok); }); ykAuth.on(function(u){ if(u) ykPay.has(a.id).then(function(ok){ if(ok) paint(true); }); }); }
else paint(true);
function wire(){
/* 당시 제목 ↔ 오늘 말 */
var o=D.querySelector('.old');
if(o){var sw=function(on){var t=o.textContent;if(on===o.classList.contains('gloss'))return;o.textContent=o.dataset.ko;o.dataset.ko=t;o.classList.toggle('gloss')};
  o.addEventListener('mouseenter',function(){sw(true)});o.addEventListener('mouseleave',function(){sw(false)});
  o.addEventListener('click',function(){sw(!o.classList.contains('gloss'))});o.addEventListener('focus',function(){sw(true)});o.addEventListener('blur',function(){sw(false)});}
/* 지면 크게 보기 */
var lb=$('lb');
D.addEventListener('click',function(e){var b=e.target.closest('figure button');if(b){lb.querySelector('img').src=b.dataset.src;lb.classList.add('on');return}if(e.target.closest('#lb'))lb.classList.remove('on')});
D.addEventListener('keydown',function(e){if(e.key==='Escape')lb.classList.remove('on')});
[].forEach.call(D.querySelectorAll('.in'),function(el,k){el.style.animationDelay=(k*.06)+'s'});
}
})();
</script>
<script src="yk-noir.js?v=11"></script>
</body>
</html>
