:root{--ink:#0e0e0e;--paper:#f4f3f0;--mute:#5e5d59;--red:#8a2a21}

body{margin:0;min-height:100vh;background:#2a2119 radial-gradient(ellipse at 50% 30%,#3a2e22,#1d1610);color:#efe6d0;font-family:"Noto Serif KR",serif;display:flex;flex-direction:column}

.bar a{color:#efe6d0;text-decoration:none}
main{flex:1;display:grid;place-items:center;padding:36px 20px 48px;text-align:center}
.k{margin:0 0 18px;font:500 11px/1 "Noto Sans KR",sans-serif;letter-spacing:.3em;color:#a9a8a3}
.mug{position:relative;width:min(240px,64vw);margin:0 auto 26px;padding:8px;background:#efe6d0;transform:rotate(-1.5deg);box-shadow:6px 8px 0 rgba(0,0,0,.35)}

.mug b{position:absolute;left:50%;top:48%;padding:7px 12px 6px;border:3px solid var(--red);color:var(--red);background:rgba(239,230,208,.88);font:900 19px/1.15 "Noto Serif KR",serif;letter-spacing:.12em;transform:translate(-50%,-50%) rotate(-11deg);white-space:nowrap}

.btn{display:inline-block;padding:13px 22px;border:1px solid #efe6d0;color:#efe6d0;font:700 14px/1 "Noto Sans KR",sans-serif;text-decoration:none}

    <a class="btn" href="seek.html">광고면으로 도라가기</a>
