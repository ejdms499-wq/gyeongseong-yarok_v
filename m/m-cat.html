<meta charset="UTF-8">

<style>
:root{--ink:#0e0e0e;--paper:#f4f3f0;--mute:#5e5d59;--red:#9c1f17}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#0b0b0b;color:#ecebe7;font-family:"Noto Serif KR",serif;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #2a2a2a;font:500 13px/1 "Noto Sans KR",sans-serif}
.bar a{color:#ecebe7;text-decoration:none}
main{flex:1;display:grid;place-items:center;padding:36px 20px 48px;text-align:center}
.k{margin:0 0 18px;font:500 11px/1 "Noto Sans KR",sans-serif;letter-spacing:.3em;color:#a9a8a3}

p.s{margin:0 auto 26px;max-width:22em;font:400 15px/1.85 "Noto Serif KR",serif;color:#cfcec9}
.btn{display:inline-block;padding:13px 22px;border:1px solid #ecebe7;color:#ecebe7;font:700 14px/1 "Noto Sans KR",sans-serif;text-decoration:none}

<div class="bar"><a href="m-seek.html">‹ 광고면</a><span>수배 제 268호</span></div>

  <div>

    <figure class="mug"><img src="assets/seek/cat_wanted.jpg" alt="수배 사진 — 268번 팻말을 든 먹색 고양이 (재현 그림)"><span class="rt">그림 · 재현</span><b>조사 중</b></figure>

    <a class="btn" href="m-seek.html">광고면으로 도라가기</a>
  </div>
